.db{position:relative;min-width:110px}.db i{position:absolute;left:0;top:1px;bottom:1px;background:var(--ac2);border-radius:4px}.db span{position:relative;padding-left:4px}
.mk{display:inline-block;width:10px;height:10px;margin-right:6px}.lgd{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:4px}
.tw table{min-width:560px}th{text-transform:none}tr.tot td{font-weight:700;border-top:2px solid var(--bd)}

<div class="flt"><h4>Bộ lọc</h4>
<label>Phạm vi<select id="gsc"><option value="mine">Của tôi</option><option value="all">Toàn team</option></select></label>

<div class="dctl"><select id="gdp"><option value="month">Tháng này</option><option value="lastmonth">Tháng trước</option><option value="quarter">Quý này</option><option value="year">Năm nay</option><option value="last12">12 tháng qua</option><option value="all">Tất cả</option><option value="custom">Tùy chọn</option></select><input type="date" id="gd1"><span>→</span><input type="date" id="gd2"></div>

<label>Hạn báo giá<input id="valid" type="date"></label><label>Trạng thái<select id="status"></select></label>
<div class="w"><div class="tw"><table class="pt" id="pt"></table></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px"><button type="button" class="btn" id="addt">+ Thêm mức giá (group size)</button><label style="flex-direction:row;align-items:center;gap:6px">Áp dụng mức<select id="tsel"></select></label></div><div id="tot" style="margin-top:6px"></div><div class="s">Tự điền theo giá Adult: Children With Bed 100%, Single Supplement 75%, Children No Bed 75% (sửa tay được). Mức giá áp dụng tự chọn theo số Adult, hoặc bạn chọn tay.</div></div><label>Tổng giá trị (USD)<input id="value" type="number" min="0"></label><label>Lợi nhuận (USD)<input id="profit" type="number"></label>
<label>Ngày follow-up tiếp<input id="fu" type="date"></label><label>Lý do thắng/thua<input id="why"></label><label>Ngày chốt (chuyển đổi)<input id="won" type="date"></label>
<label class="w">Ghi chú<textarea id="note" rows="2"></textarea></label></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="del" style="color:var(--rd)">Xóa</button><span class="sp"></span><button class="btn" id="cancel">Hủy</button><button class="btn pri" id="save">Lưu</button></div></dialog>
<script>
const ST={draft:"Đang soạn",sent:"Đã gửi",waiting:"Chờ phản hồi",negotiating:"Đàm phán",won:"Chốt",lost:"Mất"};
const OPEN=["sent","waiting","negotiating"];
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):null;
const fm=n=>(+n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const fmM=n=>"$"+fm(n);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let Q=[],db=null,me=null,mgr=false,col=null,editId=null,period="month",scope="mine";
const local=[];
function eff(q){const s=q.status==="sent"?"waiting":q.status;return OPEN.includes(q.status)&&q.valid&&days(q.valid)<0?"over":s}
function statusSel(q){const e=eff(q);return `<select class="b st ${e}" data-sid="${q.id}" onclick="event.stopPropagation()">${e==="over"?'<option value="over" selected disabled>Quá hạn</option>':""}${Object.entries(ST).filter(([k])=>k!=="sent").map(([k,v])=>`<option value="${k}"${k===e?" selected":""}>${v}</option>`).join("")}</select>`}
function lbl(q){const e=eff(q);return e==="over"?"Quá hạn":ST[e]}
function badge(q){return `<span class="b ${eff(q)}">${lbl(q)}</span>`}
function mine(){return scope==="all"||!me?Q:Q.filter(q=>q.owner===me)}
function rng(p,ref=new Date()){const y=ref.getFullYear(),m=ref.getMonth(),d=ref.getDate();
 if(p==="day")return[new Date(y,m,d),new Date(y,m,d+1)];
 if(p==="week"){const w=(ref.getDay()+6)%7;return[new Date(y,m,d-w),new Date(y,m,d-w+7)]}
 if(p==="month")return[new Date(y,m,1),new Date(y,m+1,1)];
 if(p==="quarter"){const s=Math.floor(m/3)*3;return[new Date(y,s,1),new Date(y,s+3,1)]}
 return[new Date(y,0,1),new Date(y+1,0,1)]}
let revBy="won";
const qd=q=>q.enq||q.sent||q.created;
function rd(q){return({won:[q.won,q.trip,q.enq,q.sent,q.created],trip:[q.trip,q.won,q.enq,q.sent,q.created],enq:[q.enq,q.sent,q.created]})[revBy].find(Boolean)}
function inR(q,r,w){const d=w?rd(q):qd(q);if(!d)return false;const t=new Date(d);return t>=r[0]&&t<r[1]}
function ps(a,r){const s=stats(a.filter(q=>inR(q,r))),W=stats(a.filter(q=>q.status==="won"&&inR(q,r,1)));s.won=W.won;s.rev=W.rev;s.pf=W.pf;s.rate=(W.won+s.lost)?Math.round(W.won/(W.won+s.lost)*100):0;return s}
function stats(a){const won=a.filter(q=>q.status==="won"),lost=a.filter(q=>q.status==="lost"),dec=won.length+lost.length;
 return{n:a.length,won:won.length,lost:lost.length,open:a.filter(q=>OPEN.includes(q.status)).length,
 rate:dec?Math.round(won.length/dec*100):0,rev:won.reduce((s,q)=>s+(+q.value||0),0),pf:won.reduce((s,q)=>s+(+q.profit||0),0),
 pipe:a.filter(q=>OPEN.includes(q.status)).reduce((s,q)=>s+(+q.value||0),0)}}
const CL={draft:'#94a3b8',waiting:'#5aa9ff',negotiating:'#1d63e6',won:'#10b981',lost:'#ef4444',over:'#f59e0b'};
const SL=[['draft','Đang soạn'],['waiting','Chờ phản hồi'],['negotiating','Đàm phán'],['won','Chốt'],['lost','Mất'],['over','Quá hạn']];
const fmK=n=>{const a=Math.abs(n);return(n<0?'-':'')+'$'+(a>=1e6?(a/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':a>=1e4?(a/1e3).toFixed(1).replace(/\.0$/,'')+'K':fm(a))};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dl=(c,p)=>p?`<span class="chip ${c>=p?'up':'dn'}">${c>=p?'▲':'▼'} ${Math.abs(Math.round((c-p)/p*100))}%</span><span class="s"> so với kỳ trước</span>`:'<span class="s">Chưa có kỳ trước</span>';
function monthsBetween(a,b){const r=[];let y=+a.slice(0,4),m=+a.slice(5,7);const ey=+b.slice(0,4),em=+b.slice(5,7);while((y<ey||(y===ey&&m<=em))&&r.length<120){r.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}return r.slice(-12)}
function dset(f,d1,d2){const base=mine().filter(q=>(!f.r||qOf(q)[0]===f.r)&&(!f.c||(q.company||q.client)===f.c)&&(!f.s||eff(q)===f.s));
 const ir=d=>d&&(!d1||d>=d1)&&(!d2||d<=d2),Q1=base.filter(q=>ir(qd(q))),W=base.filter(q=>q.status==="won"&&ir(rd(q))),lost=Q1.filter(q=>q.status==="lost").length,sm=(a,k)=>a.reduce((s,q)=>s+(+q[k]||0),0);
 return{base,Q1,W,n:Q1.length,won:W.length,lost,rate:W.length+lost?Math.round(W.length/(W.length+lost)*100):0,rev:sm(W,"value"),pf:sm(W,"profit"),wait:Q1.filter(q=>["waiting","negotiating"].includes(eff(q)))}}
function donut(it){const T=it.reduce((s,x)=>s+x[1],0),R=62,C=2*Math.PI*R;let off=0;
 const arcs=it.filter(x=>x[1]>0).map(([n,v,c])=>{const len=v/T*C,e=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${c}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${n}: ${v} (${Math.round(v/T*100)}%)</title></circle>`;off+=len;return e}).join("");
 return `<svg viewBox="0 0 180 180" class="donut"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--bd)" stroke-width="26"/>${arcs}<text x="90" y="92" text-anchor="middle" class="big">${T}</text><text x="90" y="110" text-anchor="middle" class="ax">báo giá</text></svg>`}
function combo(ms){const W=640,H=250,L=34,R=54,T=14,B=28,iw=W-L-R,ih=H-T-B,bw=iw/ms.length,nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p)*p},Ny=nice(Math.max(4,...ms.map(m=>m.n))),Ry=nice(Math.max(4,...ms.map(m=>m.rev)));
 let g="";for(let i=0;i<=4;i++){const y=T+ih*(1-i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${Ny*i/4}</text><text class="ax" x="${W-R+6}" y="${y+4}">${fmK(Ry*i/4)}</text>`}

 if(q.tiers&&q.tiers.length)return q.tiers.map(t=>mk(t.n,t.min,t));
 if(q.pAdult)return[mk('',0,{Adult:q.pAdult,Single:q.pSingle,Cwb:q.pCwb,Cnb:q.pCnb})];
 return[newTier()]}
function drawPT(){
 const old={};PR.forEach(([k])=>{const e=$('q'+k);old[k]=e?e.value:''});
 $('pt').innerHTML='<tr><th>Hạng mục</th>'+T.map((t,i)=>`<th><input data-t="${i}" data-f="n" placeholder="vd Min 15 ADL + 01 TL" value="${esc(t.n)}"><input data-t="${i}" data-f="min" type="number" min="0" placeholder="Min ADL" value="${esc(t.min)}">${T.length>1?`<a data-rm="${i}" style="cursor:pointer;color:var(--rd)">✕ Xóa mức</a>`:''}</th>`).join('')+'<th>SL</th><th class="num">Thành tiền</th></tr>'
 +PR.map(([k,n])=>`<tr><td>${n}</td>${T.map((t,i)=>`<td><input data-t="${i}" data-k="${k}" type="number" min="0" step="any" value="${esc(t.p[k])}"></td>`).join('')}<td><input id="q${k}" type="number" min="0"></td><td id="t${k}" class="num"></td></tr>`).join('')
 +'<tr><td><b>Tổng nếu áp dụng mức này</b></td>'+T.map((t,i)=>`<td id="tt${i}" class="num"></td>`).join('')+'<td></td><td></td></tr>';
 PR.forEach(([k])=>$('q'+k).value=old[k])}
function fillSel(v){const s=$('tsel');v=v==null?s.value:v;
 s.innerHTML='<option value="auto">Tự động theo số Adult</option>'+T.map((t,i)=>`<option value="${i}">Mức ${i+1}${t.n?': '+esc(t.n):''}</option>`).join('');

function calc(){
 const q={};PR.forEach(([k])=>q[k]=+$('q'+k).value||0);
 const sel=$('tsel').value;let ai=0;
 if(sel==='auto'){let b=-1;T.forEach((t,i)=>{const m=+t.min||0;if(m<=q.Adult&&(b<0||m>=(+T[b].min||0)))b=i});ai=b<0?0:b}else ai=Math.min(+sel,T.length-1);
 T.forEach((t,i)=>{let sm=0;PR.forEach(([k])=>sm+=(+t.p[k]||0)*q[k]);const c=$('tt'+i);c.textContent=sm?fm(sm):'–';c.style.fontWeight=i===ai?'700':'400';c.style.color=i===ai?'var(--ac)':''});
 const t=T[ai]||newTier();let tot=0;
 PR.forEach(([k])=>{const v=(+t.p[k]||0)*q[k];$('t'+k).textContent=v?fm(v):'–';tot+=v});
 $('tot').innerHTML='Tổng ('+esc(t.n||'Mức '+(ai+1))+'): <b>USD '+fm(tot)+'</b>';
 if(tot>0)$('value').value=+tot.toFixed(2);
 const pax=q.Adult+q.Cwb+q.Cnb;if(pax>0)$('pax').value=pax;
 return ai}
$('pt').addEventListener('input',e=>{const el=e.target,i=el.dataset.t;
 if(i!==undefined){const t=T[+i];
  if(el.dataset.f){t[el.dataset.f]=el.value;fillSel()}
  else{const k=el.dataset.k;t.p[k]=el.value;
   if(k==='Adult')Object.keys(RT).forEach(j=>{if(!t.m[j]){t.p[j]=t.p.Adult?String(Math.round(+t.p.Adult*RT[j])):'';const x=$('pt').querySelector('[data-t="'+i+'"][data-k="'+j+'"]');if(x)x.value=t.p[j]}});
   else if(RT[k])t.m[k]=true}}
 calc()});

function deriveCodes(c){const m=/^([A-Za-z]\d{6})(?:-([A-Za-z0-9]+))?(?:-(VN[A-Za-z0-9]*))?/.exec(String(c||'').trim());if(!m)return{qcode:'',pkg:'',agent:''};
 let pkg=(m[2]||'').toUpperCase(),ag=(m[3]||'').toUpperCase();if(!ag&&/^VN/.test(pkg)){ag=pkg;pkg=''}return{qcode:m[1].toUpperCase(),pkg,agent:ag}}
function qOf(q){return(q.qcode||deriveCodes(q.code).qcode||'').toUpperCase()}
function suggestQ(){const l=$('mkt').value,d=$('enq').value||today(),pre=l+d.slice(2,4)+d.slice(5,7);let mx=0;
 Q.forEach(q=>{const c=qOf(q);if(c.startsWith(pre)&&/^[A-Z]\d{6}$/.test(c))mx=Math.max(mx,+c.slice(5))});return pre+String(mx+1).padStart(2,'0')}
function composeCode(){const c=$('code');if(c.dataset.m)return;c.value=[$('qcode').value,$('pkg').value,$('agent').value].map(x=>x.trim().toUpperCase()).filter(Boolean).join('-')}
function refreshQ(){if($('qcode').dataset.m)return;$('qcode').value=suggestQ();composeCode()}

 const i=Q.findIndex(x=>x.id===id);const r={id,...o};i<0?Q.push(r):Q[i]=r;render()}
// nav
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.body.dataset.tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));["dash","list","rep"].forEach(s=>$(s).classList.toggle("hide",s!==b.dataset.t))});
// CSV
const HD=["qcode","pkg","agent","code","company","client","dest","pax","trip","ret","enq","sent","valid","status","value","profit","fu","note"];
const HV=["Mã báo giá","Mã chương trình","Mã đại lý","Mã booking","Công ty","Khách hàng","Điểm đến","Pax","Ngày đi","Ngày về","Ngày nhận yêu cầu","Ngày gửi","Hạn báo giá","Trạng thái","Giá trị","Lợi nhuận","Follow-up","Ghi chú"];
const TK=[['n','Tên'],['min','Min ADL'],['Adult','Adult'],['Single','Single'],['Cwb','Children With Bed'],['Cnb','Children No Bed']];
const QK=[['qAdult','SL Adult'],['qSingle','SL Single'],['qCwb','SL Children With Bed'],['qCnb','SL Children No Bed']];
for(let i=1;i<=8;i++)TK.forEach(([k,l])=>{HD.push('t'+i+'_'+k);HV.push('Mức '+i+' - '+l)});
QK.forEach(([k,l])=>{HD.push(k);HV.push(l)});
const xv=(q,k)=>{const m=/^t(\d)_(.+)$/.exec(k);return m?(q.tiers&&q.tiers[m[1]-1]?q.tiers[m[1]-1][m[2]]:''):q[k]};
function buildTiers(o){const t=[];for(let i=1;i<=8;i++){const x={n:o['t'+i+'_n']||'',min:+o['t'+i+'_min']||0};['Adult','Single','Cwb','Cnb'].forEach(k=>x[k]=+o['t'+i+'_'+k]||0);TK.forEach(([k])=>delete o['t'+i+'_'+k]);if(x.Adult||x.Single||x.Cwb||x.Cnb)t.push(x)}
 if(t.length)o.tiers=t;QK.forEach(([k])=>o[k]=+o[k]||0);return o}
function tierCalc(o){const t=o.tiers||[];if(!t.length)return o;const q={Adult:o.qAdult||0,Single:o.qSingle||0,Cwb:o.qCwb||0,Cnb:o.qCnb||0};
 let b=-1;t.forEach((x,i)=>{const m=x.min||0;if(m<=q.Adult&&(b<0||m>=(t[b].min||0)))b=i});const a=t[b<0?0:b],K=['Adult','Single','Cwb','Cnb'];
 K.forEach(k=>o['p'+k]=a[k]||0);o.tier='auto';const tot=K.reduce((s,k)=>s+(a[k]||0)*q[k],0);if(tot>0)o.value=+tot.toFixed(2);
 const pax=q.Adult+q.Cwb+q.Cnb;if(pax>0)o.pax=pax;return o}
function parse(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
 else if(ch==='"')q=true;else if(ch===","||ch===";"){row.push(c);c=""}else if(ch==="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!=="\r")c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").trim();
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parse((await f.text()).replace(/^\uFEFF/,"")).filter(r=>r.some(x=>x.trim()));
 const h=rows.shift().map(norm),idx=HV.map(v=>h.indexOf(norm(v)));let n=0;
 const inv={};Object.entries(ST).forEach(([k,v])=>inv[norm(v)]=k);
 for(const r of rows){const o={};HD.forEach((k,i)=>o[k]=idx[i]>=0?(r[idx[i]]||"").trim():"");
  o.status=inv[norm(o.status)]||(ST[o.status]?o.status:"sent");["pax","value","profit"].forEach(k=>o[k]=+String(o[k]).replace(/[^\d.-]/g,"")||0);
  buildTiers(o);tierCalc(o);{const dv=deriveCodes(o.code);["qcode","pkg","agent"].forEach(k=>{if(!o[k])o[k]=dv[k]||""})}o.owner=me||"local";o.created=today();o.updated=today();await put("i"+Date.now().toString(36)+n++,o)}
 msg(`Đã import ${n} báo giá. Dùng nút Xuất CSV để xem file mẫu đầy đủ các cột.`);e.target.value=""};
$("exp").onclick=async()=>{const esc2=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const csv="\uFEFF"+[HV.join(","),...mine().map(q=>HD.map(k=>esc2(k==="status"?ST[q.status]:xv(q,k))).join(","))].join("\n");
 try{const d=await claude.use("downloads");if(d)await d.save({filename:"bao-gia-"+today()+".csv",data:csv});else msg("Xuất file không khả dụng trong chế độ xem này.")}catch(e){if(e&&e.code!=="declined")msg("Không xuất được: "+(e.message||e.code))}};
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const DESTN={S:'Singapore',M:'Malaysia',SM:'Singapore - Malaysia',MS:'Malaysia - Singapore',BA:'Bali',JAK:'Jakarta',IN:'Indonesia',THA:'Thailand',CHI:'China',PHI:'Philippines'};
const isoD=(y,m,d)=>{const t=new Date(Date.UTC(y,m-1,d));return t.getUTCMonth()===m-1&&t.getUTCDate()===d?t.toISOString().slice(0,10):''};
function parseRange(tt,ry){
 let t=String(tt||'').toLowerCase().replace(/[–—]/g,'-').replace(/\/\//g,'/').replace(/,/g,' ');
 t=t.split(/\s(?:or|and|hoặc)\s/)[0].replace(/\s*\/\s*/g,'/').replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim();
 let m=/^(\d{1,2})(?: ([a-z]{3,9}))?(?: (\d{4}))?-(\d{1,2}) ([a-z]{3,9})(?: (\d{4}))?/.exec(t);
 if(m&&MONTHS[m[5].slice(0,3)]&&(!m[2]||MONTHS[m[2].slice(0,3)])){const m2=MONTHS[m[5].slice(0,3)],m1=m[2]?MONTHS[m[2].slice(0,3)]:m2,y2=+m[6]||+m[3]||ry,y1=+m[3]||(m1>m2?y2-1:y2);return[isoD(y1,m1,+m[1]),isoD(y2,m2,+m[4])]}
 m=/^(\d{1,2})(?:\/(\d{1,2}))?(?:\/(\d{4}))?-(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/.exec(t);
 if(m){const m2=+m[5],m1=+(m[2]||m[5]),y2=+m[6]||+m[3]||ry,y1=+m[3]||(m1>m2?y2-1:y2);return[isoD(y1,m1,+m[1]),isoD(y2,m2,+m[4])]}
 m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);if(m)return[isoD(+m[3],+m[2],+m[1]),''];
 return['',''];}
function parseDate(t,ry){const m=/(\d{1,2})\s+([A-Za-z]{3,9})\s*,?\s*(\d{4})?/.exec(t||'');const mo=m&&MONTHS[m[2].slice(0,3).toLowerCase()];return mo?isoD(+m[3]||ry,mo,+m[1]):''}
const LB='Book by \\(company\\)|Itinerary|Book by \\(staff\\)|Group size|Confirm by \\(company\\)|Confirm by \\(staff\\)|Quotation apply for|Quotation validity';
const fld=(f,n)=>{const m=new RegExp('(?:^|\\s)'+n+'\\s*:\\s*(.*?)\\s*(?=(?:'+LB+')\\s*:|\\* Please note|$)','i').exec(f);return m?m[1].trim():''};
const FL=[['Adult',/Adult Tour Fare/i],['Single',/Single Supplement/i],['Cwb',/Children With Bed/i],['Cnb',/Children No Bed/i]];
function parseFare(flat){
 const h=flat.search(/Tour Fare Per Pax/i);if(h<0)return null;const base=flat.slice(h),row={};let first=1e9;
 for(const[k,re]of FL){const m=re.exec(base);if(!m)return null;const rest=base.slice(m.index+m[0].length).replace(/^\s*\([^)]*\)/,'');const n=/^\s*((?:USD\s*[\d.,]+\s*)+)/i.exec(rest);if(!n)return null;row[k]=[...n[1].matchAll(/USD\s*([\d.,]+)/gi)].map(x=>+x[1].replace(/,/g,''));first=Math.min(first,m.index)}
 const head=flat.slice(Math.max(0,h-250),h+first),ts=[...head.matchAll(/Min\s*(\d+)\s*(?:ADL\s*\+\s*\d+\s*TL|PAX)\s*(\([^)]*\))?/gi)],fc=[...base.slice(0,first).matchAll(/\(\s*(NO FOC|\d+\s*FOC)\s*\)/gi)].map(x=>'('+x[1].toUpperCase()+')');
 const n=Math.min(...FL.map(([k])=>row[k].length));
 return Array.from({length:n},(_,i)=>({n:ts[i]?(ts[i][0].replace(/\s+/g,' ').trim()+(ts[i][2]||!fc[i]?'':' '+fc[i])):'Mức '+(i+1),min:ts[i]?+ts[i][1]:0,Adult:row.Adult[i],Single:row.Single[i],Cwb:row.Cwb[i],Cnb:row.Cnb[i]}))}
function parseHotels(flat){
 const h=flat.search(/Tour Fee/i);if(h<0)return null;let sec=flat.slice(h);const e=sec.search(/Remarks/i);if(e>0)sec=sec.slice(0,e);
 const hi=sec.search(/Star Hotel/i);if(hi<0)return null;sec=sec.slice(hi+10);
 const si=sec.search(/Single Supplement/i),head=si>=0?sec.slice(0,si):'',body=si>=0?sec.slice(si+17):sec;
 const rows=[...body.matchAll(/(\d)\s+([A-Za-z][^($]*?)\s*((?:\(\s*\$\s*[\d.,]+\s*\)\s*){2,6})/g)];if(!rows.length)return null;
 const cols=[...head.matchAll(/(\d+)\s*\+\s*\d+\s*TL\s*(\(\s*OPTION\s*\d\s*\))?/gi)].map(m=>({min:+m[1],label:m[0].replace(/\s+/g,' ').trim()}));
 const tiers=[];
 for(const r of rows){const p=[...r[3].matchAll(/\$\s*([\d.,]+)/g)].map(x=>+x[1].replace(/,/g,'')),sg=p[p.length-1],nm=r[2].trim().replace(/\s+/g,' ');
  const cs=cols.slice(0,p.length-1);
  cs.forEach((c,j)=>tiers.push({n:r[1]+'* '+nm+(cs.length>1||c.label?' - '+c.label:''),min:c.min,Adult:p[j],Single:sg,Cwb:0,Cnb:0}))}
 return tiers}
function parseQuote(text,fname){
 const flat=text.replace(/\s+/g,' ').trim(),base=String(fname||'').replace(/\.pdf$/i,''),i=base.indexOf('_');
 const code=i>0?base.slice(0,i):'',fco=i>0?base.slice(i+1).replace(/_/g,' '):'';
 const ry=/^[A-Z](\d{2})/.test(code)?2000+ +RegExp.$1:new Date().getFullYear();
 let tiers=parseFare(flat),fmt='fare';if(!tiers||!tiers.length){tiers=parseHotels(flat);fmt='hotel'}
 if(!tiers||!tiers.length)return{err:'Không tìm thấy bảng giá (Tour Fare Per Pax / Tour Fee)'};
 const company=fld(flat,'Book by \\(company\\)')||fco,client=fld(flat,'Book by \\(staff\\)');
 let dest='';
 {const t=/(\d+)\s*DAYS?\s*(\d+)\s*NIGHTS?\s+([A-Za-z ]+?)\s*(?=\*|\d\.)/i.exec(flat);if(t)dest=t[3].trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())+' '+t[1]+'D'+t[2]+'N'}
 if(!dest&&/Book by \(company\)/i.test(flat)){const v=fld(flat,'Itinerary');if(v&&v.length<150)dest=v}
 const cm=/^[A-Z]\d{6}-(\d+)([A-Z]+)/.exec(code);if(!dest&&cm&&DESTN[cm[2]])dest=DESTN[cm[2]]+' '+cm[1]+'D';
 let[trip,ret]=parseRange(fld(flat,'Quotation apply for')||((/\bDate\s*:\s*(.*?)(?=\(\d+D|Hotel Use|$)/i.exec(flat)||[])[1]),ry);
 const valid=parseDate(fld(flat,'Quotation validity')||(/Price Validity\s*:\s*([^.]*?\d{4})/i.exec(flat)||[])[1],ry);
 const gs=fld(flat,'Group size')||((/Group size\s*:\s*(.*?)(?=Date\s*:|$)/i.exec(flat)||[])[1]||'');
 return{code,company,client,dest,trip,ret,valid,tiers,fmt,note:'PDF: '+fname+(gs?' | Group size: '+gs.trim():'')}}

async function pdfText(f){const L=window.pdfjsLib;if(!L)throw new Error('chưa tải được bộ đọc PDF');
 L.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const d=await L.getDocument({data:await f.arrayBuffer()}).promise;let t='';
 for(let i=1;i<=Math.min(d.numPages,8);i++){const c=await(await d.getPage(i)).getTextContent();
  const its=c.items.filter(x=>x.str.trim()).map(x=>({x:x.transform[4],y:x.transform[5],s:x.str}));its.sort((a,b)=>b.y-a.y||a.x-b.x);
  const ls=[];its.forEach(it=>{const l=ls[ls.length-1];if(l&&Math.abs(l.y-it.y)<=3)l.it.push(it);else ls.push({y:it.y,it:[it]})});
  ls.forEach(l=>{l.it.sort((a,b)=>a.x-b.x);t+=l.it.map(x=>x.s).join(' ')+'\n'});t+='\n'}
 return t}
function mergeQuote(ex,r){const{id,...o}=ex;['company','client','dest','trip','ret','valid'].forEach(k=>{if(!o[k]&&r[k])o[k]=r[k]});
 {const dv=deriveCodes(r.code);['qcode','pkg','agent'].forEach(k=>{if(!o[k]&&dv[k])o[k]=dv[k]})}o.tiers=r.tiers;o.tier='auto';o.updated=today();if(o.status==='draft')o.status='sent';
 if(!String(o.note||'').includes(r.note))o.note=(o.note?o.note+' | ':'')+r.note;
 const q={Adult:o.qAdult||0,Single:o.qSingle||0,Cwb:o.qCwb||0,Cnb:o.qCnb||0};['Adult','Single','Cwb','Cnb'].forEach(k=>o['p'+k]=r.tiers[0][k]);
 return tierCalc(o)}
$('imppdf').onclick=()=>$('pdf').click();
$('pdf').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;let ok=0,upd=0;const bad=[];
 for(let i=0;i<fs.length;i++){msg('Đang đọc PDF '+(i+1)+'/'+fs.length+': '+fs[i].name+'…');
  try{const txt=await pdfText(fs[i]);if(txt.replace(/\s/g,'').length<80)throw new Error('PDF không có chữ, có thể là bản scan');
   const r=parseQuote(txt,fs[i].name);if(r.err)throw new Error(r.err);
   const up=r.code.toUpperCase(),pre=up.slice(0,7);
   let ex=up&&Q.find(x=>(x.code||'').toUpperCase()===up);
   if(!ex&&/^[A-Z]\d{6}$/.test(pre)){const c=Q.filter(x=>(x.code||'').toUpperCase().startsWith(pre)||(x.qcode||'').toUpperCase()===pre);if(c.length===1)ex=c[0]}
   if(ex){await put(ex.id,mergeQuote(ex,r));upd++}
   else{const o={...deriveCodes(r.code),code:r.code,company:r.company,client:r.client,dest:r.dest,pax:0,trip:r.trip,ret:r.ret,enq:'',sent:'',valid:r.valid,status:'sent',value:0,profit:0,fu:'',why:'',note:r.note,tiers:r.tiers,tier:'auto',qAdult:0,qSingle:0,qCwb:0,qCnb:0,owner:me||'local',created:today(),updated:today()};
    ['Adult','Single','Cwb','Cnb'].forEach(k=>o['p'+k]=r.tiers[0][k]);await put('p'+Date.now().toString(36)+i,o);ok++}}
  catch(err){bad.push(fs[i].name+' ('+(err.message||'lỗi')+')')}}
 msg('Đọc xong '+fs.length+' PDF: '+ok+' báo giá mới, '+upd+' báo giá cũ được bổ sung mức giá.'+(bad.length?' Không đọc được: '+bad.join('; '):' Hãy mở vài báo giá để kiểm tra lại.'));e.target.value=''};
